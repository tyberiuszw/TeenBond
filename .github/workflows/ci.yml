name: TeenBond CI & Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Unit/Integration Tests & Next.js Standalone Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest suite (Tiers 1-5)
        run: npm test

      - name: Build production Next.js bundle
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
